# Build from master so fixes made after the workflow commit are included.
# pywebview and its Windows runtime dependencies are bundled for the dedicated app window.
#
# The PyInstaller bootloader is compiled from source in this workflow, so the exe
# does not share the prebuilt bootloader that many malware samples also use.
name: Build Windows executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gzpro-mod-manager-release-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the current release source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller with a bootloader compiled from source
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --no-cache-dir --no-binary pyinstaller pyinstaller
          python -m pip install pywebview pillow pefile

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Convert GZP icon to Windows ICO
        run: python -c "from PIL import Image; Image.open('gzpicon.png').convert('RGBA').save('GZProModManager.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name GZProModManager --icon GZProModManager.ico --collect-all webview --collect-all clr_loader --collect-all pythonnet --add-data "web;web" --add-data "gzprologo.png;." --add-data "gzpicon.png;." --add-data "GZProModManager.ico;." manager.py

      - name: Check the executable carries the GZP icon
        shell: pwsh
        run: |
          $check = @'
          import sys, pefile
          for path in sys.argv[1:]:
              pe = pefile.PE(path, fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
              resources = pe.DIRECTORY_ENTRY_RESOURCE.entries if hasattr(pe, "DIRECTORY_ENTRY_RESOURCE") else []
              if pefile.RESOURCE_TYPE["RT_GROUP_ICON"] not in {entry.id for entry in resources}:
                  sys.exit(f"{path} has no icon resource")
              print(f"{path}: icon OK")
          '@
          $check | Set-Content -LiteralPath check_icon.py -Encoding utf8
          python check_icon.py dist/GZProModManager.exe

      - name: Attach builds to v1.12.14 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.14
          files: |
            dist/GZProModManager.exe
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set v1.12.14 as the latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/v1.12.14" | ConvertFrom-Json
          gh api --method PATCH "repos/${{ github.repository }}/releases/$($release.id)" -F make_latest=true
