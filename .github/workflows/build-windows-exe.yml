# Build from master so fixes made after the workflow commit are included.
# pywebview and its Windows runtime dependencies are bundled for the dedicated app window.
name: Build Windows executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gzpro-mod-manager-release-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the current release source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pillow

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Convert desktop icon to Windows ICO
        run: python -c "from PIL import Image; Image.open('gzpicon.png').convert('RGBA').save('GZProModManager.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build standalone executable with desktop icon
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name GZProModManager --icon GZProModManager.ico --collect-all webview --collect-all clr_loader --collect-all pythonnet --add-data "web;web" --add-data "gzprologo.png;." --add-data "gzpicon.png;." manager.py

      - name: Attach executable to v1.12.3 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.3
          files: dist/GZProModManager.exe
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
