name: Build Windows executable

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the v1.3.2 release source
        uses: actions/checkout@v4
        with:
          ref: v1.3.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Include launcher logo in web assets
        shell: pwsh
        run: Copy-Item -Path gzprologo.png -Destination web/gzprologo.png -Force

      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --name GZProModManager --add-data "web;web" manager.py

      - name: Attach executable to v1.3.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          files: dist/GZProModManager.exe
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
